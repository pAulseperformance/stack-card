name: test
on:
  push:
  pull_request:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test test/render.test.mjs
      - name: the example still draws
        run: node render.mjs example/stack.json /tmp/example.svg && test -s /tmp/example.svg
